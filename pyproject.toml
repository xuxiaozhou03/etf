[project]
name = "etf-backtest"
version = "0.1.0"
description = "A股ETF量化回测系统"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "ETF Backtest Team"}
]

dependencies = [
    # Web框架
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "jinja2>=3.1.0",

    # 数据处理
    "pandas>=2.1.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",

    # 数据获取
    "akshare>=1.12.0",
    "efinance>=0.5.0",
    "aiohttp>=3.9.0",
    "requests>=2.31.0",

    # 数据存储
    "pyarrow>=15.0.0",

    # 可视化（后端生成报告用）
    "plotly>=5.18.0",
    "kaleido>=0.2.0",

    # 工具库
    "joblib>=1.3.0",
    "python-dateutil>=2.8.0",
    "pytz>=2024.1",

    # 配置管理
    "pyyaml>=6.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.8.0",
    "ruff>=0.2.0",
    "black>=24.1.0",
    "pre-commit>=3.6.0",
    "httpx>=0.26.0",
]

optimize = [
    "optuna>=3.5.0",
    "scikit-learn>=1.4.0",
]

[project.scripts]
etf-backtest = "etf_backtest.interfaces.cli.main:cli"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
