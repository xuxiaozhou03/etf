<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ETF量化回测系统{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        :root {
            --primary-color: #1890ff;
            --success-color: #52c41a;
            --danger-color: #ff4d4f;
            --warning-color: #faad14;
        }
        body {
            background-color: #f0f2f5;
            min-height: 100vh;
        }
        .sidebar {
            width: 240px;
            background: #001529;
            min-height: 100vh;
            position: fixed;
            left: 0;
            top: 0;
            overflow-y: auto;
        }
        .sidebar .logo {
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 18px;
            font-weight: bold;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .sidebar .nav-link {
            color: rgba(255,255,255,0.65);
            padding: 12px 24px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .sidebar .nav-link:hover,
        .sidebar .nav-link.active {
            color: #fff;
            background: rgba(255,255,255,0.1);
        }
        .sidebar .nav-link i {
            font-size: 16px;
        }
        .main-content {
            margin-left: 240px;
            padding: 24px;
        }
        .page-header {
            margin-bottom: 24px;
        }
        .page-header h1 {
            font-size: 24px;
            font-weight: 600;
            color: #333;
            margin: 0;
        }
        .card {
            border: none;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
            border-radius: 8px;
        }
        .card-header {
            background: #fff;
            border-bottom: 1px solid #f0f0f0;
            padding: 16px 24px;
            font-weight: 600;
        }
        .stat-card {
            text-align: center;
            padding: 20px;
        }
        .stat-card .value {
            font-size: 28px;
            font-weight: 600;
            color: #333;
        }
        .stat-card .label {
            color: #666;
            margin-top: 8px;
        }
        .stat-card.positive .value { color: var(--success-color); }
        .stat-card.negative .value { color: var(--danger-color); }
        .metric-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
        }
        .metric-item {
            background: #fff;
            padding: 16px;
            border-radius: 8px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }
        .metric-item .label {
            color: #666;
            font-size: 14px;
        }
        .metric-item .value {
            font-size: 24px;
            font-weight: 600;
            margin-top: 8px;
        }
        .chart-container {
            width: 100%;
            height: 400px;
        }
        .table-hover tbody tr:hover {
            background-color: #f5f5f5;
        }
        .badge-up { background-color: var(--success-color); }
        .badge-down { background-color: var(--danger-color); }
        .loading {
            text-align: center;
            padding: 40px;
            color: #999;
        }
        .btn-primary {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
        }
        .btn-primary:hover {
            background-color: #40a9ff;
            border-color: #40a9ff;
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <div class="d-flex">
        <!-- 侧边栏 -->
        <nav class="sidebar">
            <div class="logo">
                <i class="bi bi-graph-up-arrow me-2"></i>
                ETF回测系统
            </div>
            <ul class="nav flex-column mt-3">
                <li class="nav-item">
                    <a class="nav-link {% if page == 'home' %}active{% endif %}" href="/">
                        <i class="bi bi-house"></i>
                        <span>首页</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if page == 'etfs' %}active{% endif %}" href="/etfs">
                        <i class="bi bi-list-ul"></i>
                        <span>ETF列表</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if page == 'strategies' %}active{% endif %}" href="/strategies">
                        <i class="bi bi-gear"></i>
                        <span>策略库</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if page == 'backtest' %}active{% endif %}" href="/backtest">
                        <i class="bi bi-play-circle"></i>
                        <span>新建回测</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if page == 'history' %}active{% endif %}" href="/history">
                        <i class="bi bi-clock-history"></i>
                        <span>回测历史</span>
                    </a>
                </li>
            </ul>
        </nav>

        <!-- 主内容区 -->
        <main class="main-content flex-grow-1">
            {% block content %}{% endblock %}
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
