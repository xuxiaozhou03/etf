{% extends "base.html" %}

{% block title %}回测结果 - {{ backtest_name }}{% endblock %}

{% block content %}
<div class="container-fluid py-4">
    <!-- 状态提示 -->
    <div id="statusAlert" class="alert alert-info">
        <i class="bi bi-hourglass-split me-2"></i>
        <span id="statusText">正在加载回测状态...</span>
    </div>

    <!-- 核心指标 -->
    <div id="metricsSection" style="display: none;">
        <div class="row mb-4">
            <div class="col-12">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title mb-3">核心指标</h5>
                        <div class="row" id="metricsRow">
                            <!-- 指标卡片将通过JS动态生成 -->
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 净值曲线 -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">净值曲线</h5>
                        <div id="navChart" style="height: 400px;"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 回撤曲线 -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">回撤分析</h5>
                        <div id="drawdownChart" style="height: 300px;"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 详细指标 -->
        <div class="row mb-4">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">收益指标</div>
                    <div class="card-body">
                        <table class="table table-sm" id="returnMetricsTable">
                        </table>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">风险指标</div>
                    <div class="card-body">
                        <table class="table table-sm" id="riskMetricsTable">
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <!-- 交易记录 -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <span>交易记录</span>
                        <span id="tradeCount" class="badge bg-primary">0 笔</span>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-sm table-hover" id="tradesTable">
                                <thead>
                                    <tr>
                                        <th>日期</th>
                                        <th>代码</th>
                                        <th>名称</th>
                                        <th>方向</th>
                                        <th class="text-end">数量</th>
                                        <th class="text-end">价格</th>
                                        <th class="text-end">金额</th>
                                        <th class="text-end">手续费</th>
                                    </tr>
                                </thead>
                                <tbody id="tradesBody">
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
const backtestId = '{{ backtest_id }}';

async function checkStatus() {
    try {
        const response = await fetch(`/api/backtest/${backtestId}`);
        const result = await response.json();

        const statusAlert = document.getElementById('statusAlert');
        const statusText = document.getElementById('statusText');
        const metricsSection = document.getElementById('metricsSection');

        if (result.data.status === 'completed') {
            statusAlert.className = 'alert alert-success';
            statusText.innerHTML = '<i class="bi bi-check-circle me-2"></i>回测完成';

            // 获取结果
            await loadResult();
        } else if (result.data.status === 'failed') {
            statusAlert.className = 'alert alert-danger';
            statusText.innerHTML = `<i class="bi bi-x-circle me-2"></i>回测失败: ${result.data.error || '未知错误'}`;
        } else if (result.data.status === 'running') {
            statusText.innerHTML = `<i class="bi bi-hourglass-split me-2"></i>回测执行中... 进度: ${result.data.progress}%`;
            setTimeout(checkStatus, 2000);
        } else {
            statusText.innerHTML = '<i class="bi bi-hourglass me-2"></i>等待执行...';
            setTimeout(checkStatus, 2000);
        }
    } catch (error) {
        console.error('检查状态失败:', error);
        setTimeout(checkStatus, 3000);
    }
}

async function loadResult() {
    try {
        const response = await fetch(`/api/backtest/${backtestId}/result`);
        const result = await response.json();

        if (result.code !== 0) {
            alert('获取结果失败: ' + result.message);
            return;
        }

        const data = result.data;

        // 显示指标区域
        document.getElementById('metricsSection').style.display = 'block';

        // 渲染核心指标
        renderMetrics(data.summary);

        // 渲染图表
        renderNavChart(data.daily_values);
        renderDrawdownChart(data.daily_values);

        // 渲染交易记录
        renderTrades(data.trades);

    } catch (error) {
        console.error('加载结果失败:', error);
        alert('加载结果失败');
    }
}

function renderMetrics(summary) {
    const metricsHtml = `
        <div class="col-md-2">
            <div class="border rounded p-3 text-center">
                <div class="text-muted small">总收益率</div>
                <div class="fs-4 ${summary.total_return >= 0 ? 'text-success' : 'text-danger'} fw-bold">
                    ${(summary.total_return * 100).toFixed(2)}%
                </div>
            </div>
        </div>
        <div class="col-md-2">
            <div class="border rounded p-3 text-center">
                <div class="text-muted small">年化收益</div>
                <div class="fs-4 ${summary.annualized_return >= 0 ? 'text-success' : 'text-danger'} fw-bold">
                    ${(summary.annualized_return * 100).toFixed(2)}%
                </div>
            </div>
        </div>
        <div class="col-md-2">
            <div class="border rounded p-3 text-center">
                <div class="text-muted small">最大回撤</div>
                <div class="fs-4 text-danger fw-bold">
                    -${(summary.max_drawdown * 100).toFixed(2)}%
                </div>
            </div>
        </div>
        <div class="col-md-2">
            <div class="border rounded p-3 text-center">
                <div class="text-muted small">夏普比率</div>
                <div class="fs-4 fw-bold">${summary.sharpe_ratio.toFixed(2)}</div>
            </div>
        </div>
        <div class="col-md-2">
            <div class="border rounded p-3 text-center">
                <div class="text-muted small">胜率</div>
                <div class="fs-4 fw-bold">${(summary.win_rate * 100).toFixed(1)}%</div>
            </div>
        </div>
        <div class="col-md-2">
            <div class="border rounded p-3 text-center">
                <div class="text-muted small">交易次数</div>
                <div class="fs-4 fw-bold">${summary.trade_count}</div>
            </div>
        </div>
    `;
    document.getElementById('metricsRow').innerHTML = metricsHtml;

    // 详细指标表
    document.getElementById('returnMetricsTable').innerHTML = `
        <tr><td>总收益率</td><td class="text-end">${(summary.total_return * 100).toFixed(2)}%</td></tr>
        <tr><td>年化收益率</td><td class="text-end">${(summary.annualized_return * 100).toFixed(2)}%</td></tr>
    `;

    document.getElementById('riskMetricsTable').innerHTML = `
        <tr><td>最大回撤</td><td class="text-end">${(summary.max_drawdown * 100).toFixed(2)}%</td></tr>
        <tr><td>夏普比率</td><td class="text-end">${summary.sharpe_ratio.toFixed(2)}</td></tr>
        <tr><td>卡玛比率</td><td class="text-end">${summary.calmar_ratio.toFixed(2)}</td></tr>
    `;
}

function renderNavChart(dailyValues) {
    const chart = echarts.init(document.getElementById('navChart'));

    const dates = dailyValues.map(d => d.date);
    const values = dailyValues.map(d => d.value / dailyValues[0].value);
    const benchmarkValues = dailyValues.map(d => d.benchmark_value > 0 ? d.benchmark_value / dailyValues[0].benchmark_value : null);

    const option = {
        tooltip: {
            trigger: 'axis',
            formatter: function(params) {
                let html = `<div>${params[0].axisValue}</div>`;
                params.forEach(p => {
                    if (p.value) {
                        html += `<div>${p.marker} ${p.seriesName}: ${((p.value - 1) * 100).toFixed(2)}%</div>`;
                    }
                });
                return html;
            }
        },
        legend: { data: ['策略净值', '基准净值'], bottom: 0 },
        grid: { left: '3%', right: '4%', bottom: '10%', containLabel: true },
        xAxis: { type: 'category', data: dates, boundaryGap: false },
        yAxis: {
            type: 'value',
            axisLabel: { formatter: v => ((v - 1) * 100).toFixed(0) + '%' }
        },
        series: [
            {
                name: '策略净值',
                type: 'line',
                data: values,
                smooth: true,
                lineStyle: { width: 2 },
                areaStyle: { opacity: 0.1 }
            },
            {
                name: '基准净值',
                type: 'line',
                data: benchmarkValues,
                smooth: true,
                lineStyle: { width: 1, type: 'dashed' }
            }
        ]
    };

    chart.setOption(option);
    window.addEventListener('resize', () => chart.resize());
}

function renderDrawdownChart(dailyValues) {
    const chart = echarts.init(document.getElementById('drawdownChart'));

    let peak = dailyValues[0].value;
    const drawdowns = dailyValues.map(d => {
        peak = Math.max(peak, d.value);
        return (peak - d.value) / peak;
    });

    const option = {
        tooltip: { trigger: 'axis' },
        grid: { left: '3%', right: '4%', bottom: '3%', containLabel: true },
        xAxis: {
            type: 'category',
            data: dailyValues.map(d => d.date),
            boundaryGap: false
        },
        yAxis: {
            type: 'value',
            axisLabel: { formatter: v => (v * 100).toFixed(0) + '%' },
            max: 0
        },
        series: [{
            type: 'line',
            data: drawdowns.map(d => -d),
            lineStyle: { width: 1 },
            areaStyle: {
                color: {
                    type: 'linear',
                    x: 0, y: 0, x2: 0, y2: 1,
                    colorStops: [
                        { offset: 0, color: 'rgba(255, 77, 79, 0.3)' },
                        { offset: 1, color: 'rgba(255, 77, 79, 0.05)' }
                    ]
                }
            }
        }]
    };

    chart.setOption(option);
    window.addEventListener('resize', () => chart.resize());
}

function renderTrades(trades) {
    document.getElementById('tradeCount').textContent = trades.length + ' 笔';

    const tbody = document.getElementById('tradesBody');
    tbody.innerHTML = trades.map(t => `
        <tr>
            <td>${t.date}</td>
            <td>${t.code}</td>
            <td>${t.name}</td>
            <td><span class="badge ${t.direction === 'buy' ? 'bg-success' : 'bg-danger'}">${t.direction === 'buy' ? '买入' : '卖出'}</span></td>
            <td class="text-end">${t.shares.toLocaleString()}</td>
            <td class="text-end">${t.price.toFixed(3)}</td>
            <td class="text-end">${t.amount.toLocaleString()}</td>
            <td class="text-end">${t.commission.toFixed(2)}</td>
        </tr>
    `).join('');
}

// 开始检查状态
checkStatus();
</script>
{% endblock %}
